# Production environment configuration
spring.application.name=MeloSlo-Prod
app.datasource.mode=live
logging.level.com.example.meloslo=INFO

# The encryption key must be supplied through APP_ENCRYPTION_KEY
app.encryption.require-key=true

# No SQL or bound parameters in production logs
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=INFO
logging.level.org.springframework.security=INFO

# In production, use a persistent database instead of in-memory (example)
# spring.datasource.url=jdbc:h2:file:./data/openslodb
# spring.datasource.driverClassName=org.h2.Driver
# spring.datasource.username=sa
# spring.datasource.password=${DB_PASSWORD}
