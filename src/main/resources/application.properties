spring.application.name=MeloSlo
spring.datasource.url=jdbc:h2:mem:openslodb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=false
spring.jpa.hibernate.ddl-auto=update
logging.level.com.example.meloslo=INFO

# Application Mode: 'test' for simulated data, 'live' for real connections
app.datasource.mode=test

# Seed demo data into a non-empty database (test mode only); only missing demo records are added, nothing is deleted
app.seed=false

# Encryption key for sensitive fields. Must be 16, 24 or 32 bytes (e.g. `openssl rand -base64 24` gives 32 characters).
# Required in prod and for any datasource that is not jdbc:h2:mem:. Never commit a key.
app.encryption.key=${APP_ENCRYPTION_KEY:}
# Comma-separated old keys, used only to decrypt existing data
app.encryption.legacy-keys=${APP_ENCRYPTION_LEGACY_KEYS:}
app.encryption.require-key=false
# Rewrite all encrypted columns under the current key at startup (opt-in)
app.encryption.reencrypt-on-startup=${APP_ENCRYPTION_REENCRYPT:false}

# Comma-separated allow-list of alert hosts (exact host or subdomain). Empty = any public host.
app.alerting.allowed-hosts=${APP_ALERTING_ALLOWED_HOSTS:}
